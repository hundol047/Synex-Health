name: Signed Android AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check actual signing and release configuration
        id: config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SYNEX_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.SYNEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SYNEX_KEY_PASSWORD }}
          API_BASE: ${{ vars.VITE_API_BASE }}
          APP_ID: ${{ vars.SYNEX_APPLICATION_ID }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$API_BASE" ] && [ -n "$APP_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'EXTERNAL SETUP REQUIRED: signing or production configuration missing; AAB skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: steps.config.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.config.outputs.ready == 'true'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build release assets
        if: steps.config.outputs.ready == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_PRIVACY_URL: ${{ vars.VITE_PRIVACY_URL }}
          VITE_TERMS_URL: ${{ vars.VITE_TERMS_URL }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          LEGAL_OPERATOR: ${{ vars.LEGAL_OPERATOR }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          RETENTION_POLICY: ${{ vars.RETENTION_POLICY }}
          VITE_LAUNCH_MODE: ${{ vars.VITE_LAUNCH_MODE }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_KEY }}
        run: npm ci && npm run pose:setup && npm run build:release && npx cap sync android
      - name: Sign actual release bundle
        if: steps.config.outputs.ready == 'true'
        working-directory: frontend/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SYNEX_KEYSTORE_PASSWORD: ${{ secrets.SYNEX_KEYSTORE_PASSWORD }}
          SYNEX_KEY_ALIAS: ${{ secrets.SYNEX_KEY_ALIAS }}
          SYNEX_KEY_PASSWORD: ${{ secrets.SYNEX_KEY_PASSWORD }}
          SYNEX_APPLICATION_ID: ${{ vars.SYNEX_APPLICATION_ID }}
          SYNEX_VERSION_CODE: ${{ github.run_number }}
        run: |
          export SYNEX_KEYSTORE_PATH="$RUNNER_TEMP/synex-release.jks"
          trap 'rm -f "$SYNEX_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$SYNEX_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.ready == 'true'
        with:
          name: signed-android-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
