name: Android Personal APK (no deployment)
on:
  push:
    branches: [main, fix/android-local]
  workflow_dispatch:
    inputs:
      isolated_preview:
        description: Build a separate install candidate for local persistent signing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser-checks:
    name: Personal browser checks (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run pose:setup
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.local.config.js --shard=${{ matrix.shard }}/3
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-browser-checks-${{ matrix.shard }}
          path: frontend/test-results
  personal-apk:
    runs-on: ubuntu-latest
    outputs:
      distributable: ${{ steps.signing.outputs.ready }}
    env:
      VITE_BUILD_COMMIT: ${{ github.sha }}
      SYNEX_VERSION_CODE: ${{ github.run_number }}
      SYNEX_VERSION_NAME: 1.0.${{ github.run_number }}
      SYNEX_APPLICATION_ID: ${{ inputs.isolated_preview && 'com.synex.health.personal.preview' || 'com.synex.health.personal' }}
      VITE_ISOLATED_PREVIEW: ${{ inputs.isolated_preview && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Assign monotonic personal preview version
        run: echo "SYNEX_VERSION_CODE=$((200000 + 2 * GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: frontend
      - run: npm run pose:setup
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Restore persistent personal signing key or mark build as CI only
        id: signing
        if: inputs.isolated_preview != true
        env:
          KEYSTORE: ${{ secrets.PERSONAL_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PERSONAL_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PERSONAL_ANDROID_KEY_PASSWORD }}
          SIGNER_PIN: ${{ vars.PERSONAL_ANDROID_SIGNER_SHA256 }}
        run: |
          if [ -z "$KEYSTORE$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD$SIGNER_PIN" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'CI-only ephemeral signing: this APK must not be distributed as an update.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$KEYSTORE" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          [[ "$SIGNER_PIN" =~ ^[a-f0-9]{64}$ ]]
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/personal-signing.jks"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'PERSONAL_SIGNING_REQUIRED=true' >> "$GITHUB_ENV"
          echo "SYNEX_KEYSTORE_PATH=$RUNNER_TEMP/personal-signing.jks" >> "$GITHUB_ENV"
          echo "SYNEX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SYNEX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SYNEX_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "PERSONAL_SIGNER_SHA256=$SIGNER_PIN" >> "$GITHUB_ENV"
      - run: npm run android:local
        working-directory: frontend
      - name: Enable KVM for native Android checks
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify encrypted records survive an in-place Android APK update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-update-ci.sh
      - name: Verify personal mode inside the APK
        run: |
          python - <<'PY'
          import json, os, zipfile, subprocess
          with zipfile.ZipFile('frontend/android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              marker=json.loads(apk.read('assets/public/release-config.json'))
              assert marker['localOnly'] is True and marker['release'] is False
              assert not marker['api']
              scripts=b'\n'.join(apk.read(n) for n in apk.namelist() if n.startswith('assets/public/') and n.endswith('.js'))
              assert b'device-balanced-v2' in scripts
              assert os.environ['VITE_BUILD_COMMIT'][:8].encode() in scripts
          badging=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/36.0.0/aapt','dump','badging','frontend/android/app/build/outputs/apk/debug/app-debug.apk'],text=True)
          assert "name='"+os.environ['SYNEX_APPLICATION_ID']+"'" in badging
          assert ('Synex Health 검증판' if os.environ.get('VITE_ISOLATED_PREVIEW')=='true' else 'Synex Health 개인용') in badging
          print('Verified personal mode, package ID, app label, local algorithm and current build ID')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.isolated_preview && 'ISOLATED-CANDIDATE-LOCAL-SIGNING-REQUIRED' || steps.signing.outputs.ready == 'true' && 'Synex-Health-Android-Personal' || 'CI-ONLY-NOT-FOR-DISTRIBUTION' }}-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-screen-checks
          path: frontend/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-test-results
          path: ${{ runner.temp }}/synex-update/update-report.json
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/personal-signing.jks"

  personal-download-ready:
    name: Personal APK download checks
    needs: [browser-checks, personal-apk]
    if: needs.personal-apk.outputs.distributable == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "All browser shards and Android startup checks passed for $GITHUB_SHA"
