name: Publish verified Android preview download

on:
  push:
    branches: [codex/android-download]
    paths: [.github/workflows/android-download.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-preview-683c446
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hundol047/Synex-Health'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '36971428018'
      SOURCE_SHA: 683c446bf3b4a5fc3308277ce6339b0ad2b1d5db
      APK_SHA256: dcee5481e73a87b5a503b90c30ced97c2f24dc8a6b80965667142e230f761ba6
      RELEASE_TAG: android-preview-683c446
    steps:
      # Publish the exact successful CI artifact; do not execute repository code.
      - name: Verify source build and APK
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          PY
          gh run download "$SOURCE_RUN" --name android-debug-build --dir artifact
          echo "$APK_SHA256  artifact/app-debug.apk" | sha256sum --check --strict
          mkdir release
          cp artifact/app-debug.apk release/Synex-Health-preview.apk
          (cd release && sha256sum Synex-Health-preview.apk > SHA256SUMS.txt)

      - name: Publish test-only prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## Android 개발용 미리보기

          APK를 내려받아 Android에서 설치할 수 있는 테스트 빌드입니다.
          운영 서버와 실제 로그인 제공자가 아직 연결되지 않아 정상적인 서비스 이용은 준비되지 않았습니다.
          Google Play 출시용 또는 iPhone 설치용 파일이 아닙니다. 설치 시 Android의 사용자 확인이 필요합니다.

          - 원본: 683c446bf3b4a5fc3308277ce6339b0ad2b1d5db
          - 성공한 CI: https://github.com/hundol047/Synex-Health/actions/runs/36971428018
          - 해당 실행의 android-debug-build APK를 재빌드 없이 그대로 제공합니다.
          - SHA-256: dcee5481e73a87b5a503b90c30ced97c2f24dc8a6b80965667142e230f761ba6
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > existing.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          release = json.load(open('existing.json'))
          assert release['isPrerelease'] and not release['isDraft']
          PY
            mkdir existing
            gh release download "$RELEASE_TAG" --pattern Synex-Health-preview.apk --dir existing
            echo "$APK_SHA256  existing/Synex-Health-preview.apk" | sha256sum --check --strict
          else
            gh release create "$RELEASE_TAG" \
              release/Synex-Health-preview.apk release/SHA256SUMS.txt \
              --target "$SOURCE_SHA" --prerelease --latest=false \
              --title 'Synex Health Android preview — 2026-10-02' \
              --notes-file notes.md
          fi
