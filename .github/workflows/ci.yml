name: Verify Synex Health
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  VITE_BUILD_COMMIT: ${{ github.sha }}
  SYNEX_VERSION_CODE: ${{ github.run_number }}
  SYNEX_VERSION_NAME: 1.0.${{ github.run_number }}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: python scripts/scan-secrets.py
      - run: PYTHONPATH=. python scripts/migrate.py
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run pose:setup
        working-directory: frontend
      - run: npm run pose:evaluate
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx cap sync
        working-directory: frontend

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: synex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/synex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest
      - run: PYTHONPATH=. python scripts/migrate.py
        working-directory: backend
      - run: PYTHONPATH=. python scripts/verify_postgres.py
        working-directory: backend
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: python scripts/verify_postgres_restore.py
        working-directory: backend
        env:
          SYNEX_DISPOSABLE_DB: 'true'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-browser-evidence
          path: |
            frontend/test-results
            frontend/playwright-report

  android-compile:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci && npm run pose:setup
        working-directory: frontend
      - run: npm run pose:evaluate && npm run build && npx cap sync android
        working-directory: frontend
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - name: Verify the APK contains the fixed UI and this build ID
        run: |
          python - <<'PY'
          import glob, os, zipfile
          path=glob.glob('frontend/android/app/build/outputs/apk/debug/*.apk')[0]
          with zipfile.ZipFile(path) as apk:
              scripts=b'\\n'.join(apk.read(n) for n in apk.namelist() if n.startswith('assets/public/') and n.endswith('.js'))
              styles=b'\\n'.join(apk.read(n) for n in apk.namelist() if n.startswith('assets/public/') and n.endswith('.css'))
          assert b'bottom-actions-v2' in scripts, 'Wrong UI revision in APK'
          assert os.environ['VITE_BUILD_COMMIT'][:8].encode() in scripts, 'Wrong commit in APK'
          assert b'.workout-bottom-actions' in styles, 'Fixed dock CSS missing in APK'
          print('APK contains bottom-actions-v2, viewport dock CSS and current commit')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk

  ios-compile:
    runs-on: macos-15
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run pose:setup
        working-directory: frontend
      - run: npm run pose:evaluate && npm run build && npx cap sync ios
        working-directory: frontend
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: frontend/ios/App

  container-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image with explicit CI-only public settings
        run: |
          docker build -f docker/Dockerfile -t synex-release-test \
            --build-arg VITE_API_BASE=https://ci.synex-health.invalid \
            --build-arg VITE_PRIVACY_URL=https://ci.synex-health.invalid/privacypolicy.html \
            --build-arg VITE_SUPPORT_URL=https://ci.synex-health.invalid/support \
            --build-arg VITE_TERMS_URL=https://ci.synex-health.invalid/terms.html \
            --build-arg LEGAL_OPERATOR=CI-Operator \
            --build-arg SUPPORT_EMAIL=ci@synex-health.invalid \
            --build-arg RETENTION_POLICY=CI-only-retention .
      - name: Reject missing release settings and missing runtime authentication
        run: |
          if docker build -f docker/Dockerfile --target frontend-release .; then
            echo 'Unconfigured release unexpectedly built'; exit 1
          fi
          if docker run --rm synex-release-test; then
            echo 'Unconfigured production unexpectedly started'; exit 1
          fi
      - name: Verify served model, legal pages and release marker
        run: |
          docker run -d --name synex-smoke -p 8123:8000 -e APP_ENV=development -e AUTH_MODE=demo synex-release-test
          python scripts/verify-container.py
      - name: Container logs
        if: failure()
        run: docker logs synex-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f synex-smoke || true
